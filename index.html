<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Koala admissions</title>
    <link rel="stylesheet" href="index.css" />
  </head>
<body>
  <div id="layout">
    <div id="stage">
      <canvas id="canvas"></canvas>
      <div id="labels"></div>
    </div>

    <div id="side">
      <div id="buttons">
        <button id="btn-all">All</button>
        <button id="btn-cause">By cause</button>
        <button id="btn-month">By month</button>
        <button id="btn-outcomes">By outcome</button>
      </div>
      <p id="caption"></p>
      <div id="card" aria-live="polite">Click a square to see that koala's record.</div>
    </div>
  </div>
  <script src="main.js"></script>
</body>
